name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "file:./dev.db"
  SESSION_SECRET: "ci-only-secret-not-used-in-production-0123456789"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Типы, тесты, сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Линтер
        run: npm run lint
      - name: Проверка типов
        run: npm run typecheck
      - name: Модульные и интеграционные тесты
        run: npm test
      - name: Production-сборка
        # next/font скачивает шрифты Google Fonts при сборке; повтор защищает от сетевых сбоев.
        run: npm run build || (sleep 15 && npm run build)
      - name: Таблица демонстрационных сценариев
        run: |
          { echo '### Демонстрационные сценарии (движок, без БД)'; echo '```'; npm run -s report:scenarios; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (desktop, tablet, mobile)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      # Playwright 1.56 поддерживает Ubuntu до 24.04; ubuntu-latest уже переходит на 26.04.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
